server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DATABASE}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: ${JACKSON_TIME_ZONE:Asia/Ho_Chi_Minh}

  flyway:
    enabled: true
    locations: filesystem:../db/migration
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  jackson:
    time-zone: ${JACKSON_TIME_ZONE:Asia/Ho_Chi_Minh}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}